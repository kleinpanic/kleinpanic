# kleinpanic profile README — curated config.
# This is the ONLY file that needs manual editing. Everything displayed about
# the entries below (descriptions, stars, activity) is pulled live from APIs
# by scripts/generate_readme.py.

github:
  user: kleinpanic

  # Six curated featured repos. Order = display order.
  featured:
    - fblogin
    - toralizer
    - GSD-OC
    - lumos
    - memory-spark
    - mission-control

  # "Recently Active" table settings.
  recent_count: 5
  recent_exclude:
    - kleinpanic   # this profile repo — workflow commits would dominate the list
    - Archived     # graveyard repo, noise

huggingface:
  # NOTE: huggingface.co/kleinpanic is a 404 — correct handle is kleinpanic93.
  user: kleinpanic93
  max_items: 5

# npm section — auto-fetches via registry search API when enabled.
# Flip enabled: true once you publish your first package.
npm:
  enabled: false
  user: kleinpanic
  max_items: 5

# PyPI section stays hidden until package names are confirmed.
# PyPI has no clean "list my packages" endpoint, so packages are listed
# explicitly here and each is fetched from /pypi/<name>/json.
pypi:
  enabled: false
  user: kleinpanic
  packages: []
  # - name: my-package
  # - name: another-package

# Zenodo — uncomment + populate when you publish a dataset/release.
# Generator support is not wired yet; this is just a TODO marker so we
# remember the next integration to add. Drop the DOI list in when ready.
# zenodo:
#   enabled: false
#   dois: []
#     # - doi: 10.5281/zenodo.XXXXXXX
#     #   title: my-dataset

# Curated "Things I've built that I actually use" entries. Each renders as
# a <details> block with a one-line description and a code snippet.
# Order = display order. Empty list = section hidden.
highlights:
  - name: toralizer
    description: transparent Tor proxy for any program
    lang: bash
    code: |
      $ toralizer curl https://ifconfig.me
      # → routes curl through Tor via LD_PRELOAD SOCKS5 hook
      # → no app config needed, works on anything dynamically linked

      $ toralizer wget https://example.com/file.tar.gz
  - name: lumos
    description: unified brightness control (laptop + external monitors)
    lang: bash
    code: |
      $ lumos 70          # set laptop backlight to 70% via sysfs
      $ lumos --ddc 50    # set external monitor via DDC/CI protocol
      $ lumos             # show current brightness levels
  - name: quicknotes
    description: terminal sticky notes with VimWiki integration
    lang: bash
    code: |
      $ quicknotes add "fix the lumos DDC edge case"
      $ quicknotes ls
        [0] fix the lumos DDC edge case
        [1] read more about libsodium streams

      $ quicknotes nb     # opens a VimWiki scratchpad in Neovim
  - name: OSLA
    description: offline LICENSE generator
    lang: bash
    code: |
      $ osla MIT          # writes LICENSE with current year + git author
      $ osla --list       # show available license templates
      $ osla GPL-3.0
  - name: bx
    description: encrypted, resumable backups over SSH
    lang: bash
    code: |
      $ bx client sync /home/klein user@server:/backups
      # → BLAKE3 hashed, libsodium encrypted, zstd compressed
      # → resumable, SQLite manifest, deduped

      $ bx server start   # run as a backup receive daemon
  - name: fblogin
    description: framebuffer display manager
    lang: text
    code: |
      # Replaces getty entirely — runs directly on /dev/fb0
      # PAM auth + fprintd fingerprint support
      # No X11, no Wayland, no display server needed at boot

# Current focus — renders as a "Currently" section above Things I've built.
# Empty list = section hidden.
now:
  - "Memory-spark 15-stage RAG pipeline on DGX Spark"
  - "GSD-OC lifecycle orchestration"
  - "Kleinpanic profile README generator (this repo)"

# Links row badges (shields.io, flat-square). Add/remove entries freely;
# unknown handles should stay commented out, not guessed.
links:
  - { label: web,         text: kleinpanic.com,     url: "https://kleinpanic.com",              logo: firefox,     color: "EA24F7" }
  - { label: git,         text: git.kleinpanic.com, url: "https://git.kleinpanic.com",          logo: gitea,       color: "609926" }
  - { label: github,      text: kleinpanic,         url: "https://github.com/kleinpanic",       logo: github,      color: "181717" }
  - { label: huggingface, text: kleinpanic93,       url: "https://huggingface.co/kleinpanic93", logo: huggingface, color: "FF9D00" }
  # - { label: youtube,   text: TODO-handle,        url: "https://youtube.com/@TODO",           logo: youtube,     color: "FF0000" }
  # pypi link intentionally omitted while pypi.enabled is false
  # npm link intentionally omitted while npm.enabled is false
