name: Update profile README

on:
  schedule:
    # Weekly Monday 04:23 UTC — the "last refreshed" line keeps the repo
    # active so GitHub doesn't pause the schedule (60-day inactivity rule).
    - cron: "23 4 * * 1"
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - README.template.md
      - profile.yml
      - scripts/**
      - tests/**
      - .github/workflows/update-profile.yml

# Two concurrency groups so cron + manual pushes never kill each other.
# - cron-profile: only one cron run in flight; older cron runs get cancelled.
# - push-profile: only one push-triggered run in flight; older pushes get
#   cancelled (so back-to-back pushes don't pile up).
# Previously these shared one group ("update-profile" with
# cancel-in-progress: true). That meant a Monday 04:23 UTC cron could
# cancel an in-progress push-triggered regen (or vice-versa) and leave the
# README in a partially-regenerated state — see commit 3d3aacb.
# The ref is part of the push group so PR / branch runs never cancel a
# regen on main.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'cron-profile' || format('push-profile-{0}', github.ref) }}
  cancel-in-progress: true

# Read-only by default; only the regenerate job (main only) may push.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Lint with ruff
        run: |
          # ruff is pinned in scripts/requirements.txt to avoid surprise CI
          # failures from a fresh `pip install ruff` pulling a newer version
          # with new rules.
          ruff check scripts/ tests/

      - name: Run offline tests (fixtures)
        run: python3 -m unittest discover -s tests -v

  regenerate:
    needs: test
    # Only regenerate + commit on main. PRs and feature-branch pushes run the
    # test job only, so the bot never commits onto a contributor's branch.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so `git log -1 README.md` below finds the commit
          # that last touched README.md, not just the shallow HEAD.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Cron guard: if a human (or another workflow run) just touched
      # README.md, the cron must NOT overwrite that. workflow_dispatch and
      # push runs skip this guard — they always run.
      - name: Skip if README was edited in the last 30 minutes
        id: freshness_check
        if: github.event_name == 'schedule'
        run: |
          AGE_MIN=$(( ( $(date +%s) - $(git log -1 --format=%ct README.md) ) / 60 ))
          echo "README.md last touched ${AGE_MIN} minutes ago"
          if [ "$AGE_MIN" -lt 30 ]; then
            echo "skip=README too fresh — deferring to the more recent edit" >> "$GITHUB_OUTPUT"
          else
            echo "skip=ok" >> "$GITHUB_OUTPUT"
          fi

      # continue-on-error keeps the job green so the retry below can run
      # and its result still reaches the commit step. (With plain
      # `if: failure()` the job stayed failed and the commit was skipped.)
      - name: Regenerate README
        id: regen
        if: steps.freshness_check.outputs.skip != 'README too fresh — deferring to the more recent edit'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_readme.py

      - name: Regenerate README (retry on flake)
        if: steps.regen.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_readme.py

      - name: Commit only if output changed
        if: steps.freshness_check.outputs.skip != 'README too fresh — deferring to the more recent edit'
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged — nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: regenerate profile README"
            git push
          fi