name: Update profile README

on:
  schedule:
    # Weekly Monday 04:23 UTC — the "last refreshed" line keeps the repo
    # active so GitHub doesn't pause the schedule (60-day inactivity rule).
    - cron: "23 4 * * 1"
  workflow_dispatch:
  push:
    paths:
      - README.template.md
      - profile.yml
      - scripts/**
      - tests/**
      - .github/workflows/update-profile.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run offline tests (fixtures)
        run: python3 -m unittest discover -s tests -v

      - name: Regenerate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_readme.py

      - name: Commit only if output changed
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged — nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: regenerate profile README"
            git push
          fi
