name: Update profile README

on:
  schedule:
    # Weekly Monday 04:23 UTC — the "last refreshed" line keeps the repo
    # active so GitHub doesn't pause the schedule (60-day inactivity rule).
    - cron: "23 4 * * 1"
  workflow_dispatch:
  push:
    paths:
      - README.template.md
      - profile.yml
      - scripts/**
      - tests/**
      - .github/workflows/update-profile.yml

# Two concurrency groups so cron + manual pushes never kill each other.
# - cron-profile: only one cron run in flight; older cron runs get cancelled.
# - push-profile: only one push-triggered run in flight; older pushes get
#   cancelled (so back-to-back pushes don't pile up).
# Previously these shared one group ("update-profile" with
# cancel-in-progress: true). That meant a Monday 04:23 UTC cron could
# cancel an in-progress push-triggered regen (or vice-versa) and leave the
# README in a partially-regenerated state — see commit 3d3aacb.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'cron-profile' || 'push-profile' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Lint with ruff
        run: |
          # ruff is pinned in scripts/requirements.txt to avoid surprise CI
          # failures from a fresh `pip install ruff` pulling a newer version
          # with new rules.
          ruff check scripts/ tests/

      - name: Lint README + template with markdownlint-cli2
        run: |
          # markdownlint-cli2 catches table/heading/blank-line issues that
          # would otherwise only surface when the rendered README looks broken
          # in a browser. Pinned to a specific version via npx --yes so new
          # rules don't suddenly fail CI. profile.yml is YAML, not Markdown,
          # so it's intentionally excluded — linting it just produces noise.
          npx --yes markdownlint-cli2@0.23.2 "README.md" "README.template.md" \
            || (echo "--- markdownlint violations above ---"; \
                echo "If a rule is wrong, fix the doc, not the rule."; \
                exit 1)

      - name: Run offline tests (fixtures)
        run: python3 -m unittest discover -s tests -v

  regenerate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Cron guard: if a human (or another workflow run) just touched
      # README.md, the cron must NOT overwrite that. workflow_dispatch and
      # push runs skip this guard — they always run.
      - name: Skip if README was edited in the last 30 minutes
        id: freshness_check
        if: github.event_name == 'schedule'
        run: |
          AGE_MIN=$(( ( $(date +%s) - $(git log -1 --format=%ct README.md) ) / 60 ))
          echo "README.md last touched ${AGE_MIN} minutes ago"
          if [ "$AGE_MIN" -lt 30 ]; then
            echo "skip=README too fresh — deferring to the more recent edit" >> "$GITHUB_OUTPUT"
          else
            echo "skip=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate README
        if: steps.freshness_check.outputs.skip != 'README too fresh — deferring to the more recent edit'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_readme.py

      - name: Regenerate README (retry on flake)
        if: failure() && steps.freshness_check.outputs.skip != 'README too fresh — deferring to the more recent edit'
        run: python3 scripts/generate_readme.py

      - name: Commit only if output changed
        if: steps.freshness_check.outputs.skip != 'README too fresh — deferring to the more recent edit'
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged — nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: regenerate profile README"
            git push
          fi